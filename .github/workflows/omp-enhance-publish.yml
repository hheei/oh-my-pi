name: Publish @hheei/omp-enhance

on:
  push:
    branches:
      - main
    paths:
      - "packages/hepi/omp-enhance/package.json"
      - ".github/workflows/omp-enhance-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Set up Node and npm registry
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.17.0

      - name: Install repository tooling
        run: bun install --frozen-lockfile

      - name: Build native addon
        working-directory: packages/natives
        run: bun run build

      - name: Install extension dependencies
        working-directory: packages/hepi/omp-enhance
        run: bun install --no-save --ignore-scripts --omit=peer

      - name: Check and test extension
        working-directory: packages/hepi/omp-enhance
        run: bun run check && bun test src

      - name: Publish package
        working-directory: packages/hepi/omp-enhance
        run: npm publish --access public
