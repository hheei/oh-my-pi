name: Publish @hheei/omp-optimizer

on:
  push:
    branches:
      - main
    paths:
      - "packages/hepi/omp-optimizer/package.json"
      - ".github/workflows/omp-optimizer-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Set up Node and npm registry
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.17.0

      - name: Skip if already published
        id: published
        working-directory: packages/hepi/omp-optimizer
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install repository tooling
        if: steps.published.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Build native addon
        if: steps.published.outputs.skip != 'true'
        working-directory: packages/natives
        run: bun run build

      - name: Install extension dependencies
        if: steps.published.outputs.skip != 'true'
        working-directory: packages/hepi/omp-optimizer
        run: bun install --no-save --ignore-scripts --omit=peer

      - name: Check and test extension
        if: steps.published.outputs.skip != 'true'
        working-directory: packages/hepi/omp-optimizer
        run: bun run check && bun test src

      - name: Publish package
        if: steps.published.outputs.skip != 'true'
        working-directory: packages/hepi/omp-optimizer
        run: npm publish --access public
